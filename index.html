<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SqueakStack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; position:fixed; inset:0; width:100%;
    overscroll-behavior:none; touch-action:none; background:#bfe3ff;
    font-family:'Nunito',sans-serif; user-select:none; -webkit-user-select:none; }
  .display { font-family:'Fredoka',sans-serif; }
  .hidden { display:none !important; }

  #stage { position:absolute; inset:0; transition:transform .55s ease; }
  #stage.flip { transform:rotate(180deg); }
  canvas { position:absolute; inset:0; display:block; }

  .chip { font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px; color:#fff;
    padding:6px 13px; border-radius:999px; box-shadow:0 3px 0 rgba(0,0,0,.15); opacity:.6; transition:all .25s;
    white-space:nowrap; }
  .chip.turn { opacity:1; transform:scale(1.08); }
  .chip svg { width:13px; height:13px; vertical-align:-2px; margin-left:2px; }

  /* defender zone (far end) */
  #defZone { position:absolute; top:0; left:0; right:0; z-index:2;
    padding:max(10px, env(safe-area-inset-top, 0px)) 10px 8px;
    display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
  body.table #defZone { transform:rotate(180deg); }
  .zoneRow { display:flex; gap:12px; align-items:center; justify-content:center; }
  #cheesePad { pointer-events:auto; width:min(94%, 460px); height:100px;
    border:3px dashed rgba(184,134,11,.75); background:rgba(255,216,77,.22); border-radius:20px;
    display:flex; align-items:center; justify-content:center; color:#8a6508;
    font-weight:800; font-size:14px; touch-action:none; }

  /* dropper zone (near end) */
  #bottomZone { position:absolute; bottom:0; left:0; right:0; z-index:2;
    padding:0 10px max(14px, env(safe-area-inset-bottom, 0px));
    display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:none; }
  #banner { text-align:center; font-family:'Fredoka',sans-serif; font-weight:600;
    font-size:18px; color:#274060; text-shadow:0 1px 0 rgba(255,255,255,.7); }
  #hint { text-align:center; font-weight:800; font-size:12px; color:#4e6a8d; }

  .itemBtn { pointer-events:auto; width:60px; height:60px; border-radius:50%;
    background:#fff; border:3px solid #1d2733; color:#1d2733; padding:11px;
    box-shadow:0 4px 0 rgba(0,0,0,.3); transition:transform .08s; }
  .itemBtn svg { width:100%; height:100%; display:block; }
  .itemBtn:active { transform:translateY(3px); }
  .itemBtn:disabled { opacity:.32; }
  #dropBtn { pointer-events:auto; font-family:'Fredoka',sans-serif; font-weight:700; font-size:24px;
    letter-spacing:2px; color:#fff; background:#ff4f9a; border:none; border-radius:999px;
    padding:16px 54px; box-shadow:0 6px 0 #c73374, 0 12px 24px rgba(0,0,0,.18); transition:transform .08s, box-shadow .08s; }
  #dropBtn:active { transform:translateY(4px); box-shadow:0 2px 0 #c73374; }
  #dropBtn:disabled { background:#b8c4d4; box-shadow:0 6px 0 #93a2b5; font-size:18px; letter-spacing:0; }

  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(30,50,80,.35); backdrop-filter:blur(3px); z-index:10; }
  .panel { background:#fffaf2; border-radius:28px; padding:26px 22px; width:min(88vw, 380px);
    text-align:center; box-shadow:0 16px 40px rgba(0,0,0,.25); }
  .panel h1 { font-family:'Fredoka',sans-serif; font-weight:700; font-size:32px; color:#274060; }
  .panel .sub { font-weight:800; color:#7a8ba3; font-size:13.5px; margin:6px 0 16px; }
  .nameRow { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .dot { width:22px; height:22px; border-radius:8px; flex:none; }
  .nameRow input { flex:1; font-family:'Fredoka',sans-serif; font-weight:600; font-size:18px;
    padding:11px 14px; border-radius:16px; border:2.5px solid #e5dccc; background:#fff; color:#274060; outline:none; }
  .nameRow input:focus { border-color:#2f7bff; }
  #tableRow { display:flex; align-items:center; gap:8px; justify-content:center; margin:8px 0 4px;
    font-weight:800; color:#4e6a8d; font-size:13.5px; }
  #tableRow input { width:20px; height:20px; accent-color:#2f7bff; }
  .bigBtn { font-family:'Fredoka',sans-serif; font-weight:700; font-size:22px; color:#fff;
    background:#2f7bff; border:none; border-radius:999px; padding:13px 44px; margin-top:8px;
    box-shadow:0 6px 0 #1d55c0; }
  .bigBtn:active { transform:translateY(4px); box-shadow:0 2px 0 #1d55c0; }
  /* start-screen explainer: same rules block twice - one right-side up for the
     near player, one rotated 180° so the far player reads it from their edge */
  #startOv { flex-direction:column; gap:10px; overflow-y:auto; touch-action:pan-y;
    padding:max(10px, env(safe-area-inset-top,0px)) 10px max(10px, env(safe-area-inset-bottom,0px)); }
  #rulesFlip { transform:rotate(180deg); flex:none; margin-top:auto;
    background:#fffaf2; border-radius:22px; padding:11px 14px; width:min(88vw, 380px);
    box-shadow:0 10px 26px rgba(0,0,0,.2); }
  #startPanel { flex:none; margin-bottom:auto; padding:15px 18px 18px; }
  #startPanel h1 { font-size:27px; margin-bottom:7px; }
  #rulesMain { margin-bottom:11px; }
  .ruleGoal { font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px;
    color:#274060; line-height:1.3; text-align:center; }
  .ruleGoal b { color:#ff4f5e; }
  .ruleCtl { font-weight:800; font-size:11.5px; color:#4e6a8d; line-height:1.4;
    text-align:center; margin:5px 0 7px; }
  .ruleCtl b { color:#ff4f9a; }
  .ruleRow { display:flex; gap:9px; align-items:center; text-align:left;
    font-weight:700; font-size:12px; color:#3c536e; line-height:1.25; margin-top:6px; }
  .ruleRow b { font-family:'Fredoka',sans-serif; font-weight:600; color:#274060; }
  .rIcon { flex:none; width:27px; height:27px; border-radius:50%; background:#fff;
    border:2.5px solid #1d2733; color:#1d2733; padding:4px; box-shadow:0 2px 0 rgba(0,0,0,.12); }
  .rIcon svg { width:100%; height:100%; display:block; }
  .rIcon.rEmoji { display:flex; align-items:center; justify-content:center; font-size:13px; padding:0; }
  .ruleOnce { font-weight:800; font-size:11px; color:#7a8ba3; text-align:center; margin-top:7px; }
  #rulesFlip .ruleGoal { font-size:13px; }
  #rulesFlip .ruleRow { font-size:11px; }
  #rulesFlip .rIcon { width:24px; height:24px; padding:3.5px; }

  #overTitle { font-size:26px; }
  #overMsg { font-family:'Fredoka',sans-serif; font-weight:600; font-size:19px; color:#ff4f9a; margin-top:8px; }
  #overScore { font-weight:800; color:#4e6a8d; margin-top:12px; font-size:15px; }
  #mute { position:absolute; top:calc(env(safe-area-inset-top,0px) + 8px); right:10px; z-index:5;
    pointer-events:auto; background:rgba(255,255,255,.6); border:none; border-radius:12px;
    font-size:16px; padding:5px 8px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="defZone">
    <div class="zoneRow">
      <span class="chip" id="chipDef"></span>
      <button class="itemBtn" id="cheeseBtn" title="Fly the cheese!"></button>
      <button class="itemBtn" id="catBtn" title="Cat swipe!"></button>
    </div>
    <div id="cheesePad" class="hidden">drag here — the cheese follows your finger!</div>
  </div>
  <div id="bottomZone">
    <span class="chip" id="chipDrop"></span>
    <div id="banner" class="display">&nbsp;</div>
    <div id="hint">&nbsp;</div>
    <div class="zoneRow">
      <button class="itemBtn" id="trapBtn" title="Place your trap!"></button>
      <button id="dropBtn" class="display">DROP</button>
    </div>
  </div>
</div>
<button id="mute">🔊</button>

<div class="overlay" id="startOv">
  <div class="miniPanel" id="rulesFlip"></div>
  <div class="panel" id="startPanel">
    <h1>Squeak<span style="color:#ff4f9a">Stack</span> 🐭</h1>
    <div id="rulesMain"></div>
    <div class="nameRow"><span class="dot" style="background:#ff6a3d"></span><input id="n0" maxlength="12" placeholder="Player 1"></div>
    <div class="nameRow"><span class="dot" style="background:#2f7bff"></span><input id="n1" maxlength="12" placeholder="Player 2"></div>
    <label id="tableRow"><input type="checkbox" id="tableChk" checked> phone flat on the table — screen flips each turn</label>
    <button class="bigBtn" id="startBtn">Play!</button>
  </div>
</div>

<div class="overlay hidden" id="overOv">
  <div class="panel">
    <h1 id="overTitle" class="display">💥 Squeak!!</h1>
    <div id="overMsg"></div>
    <div id="overScore"></div>
    <button class="bigBtn" id="againBtn" style="background:#12b981; box-shadow:0 6px 0 #0b7f58;">Play again</button>
  </div>
</div>

<script src="matter.min.js"></script>
<script src="decomp.min.js"></script>
<script src="outlines.js"></script>
<script src="game.js"></script>
</body>
</html>
